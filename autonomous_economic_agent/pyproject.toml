[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aea"
version = "0.1.0"
description = "ControlOps autonomous economic agent control plane (M1 mock-first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
solana = [
    "solana>=0.36,<0.37",
    "solders>=0.26,<0.27",
]
evm = [
    "eth-account>=0.13,<0.14",
    "eth-abi>=5,<6",
    "eth-utils>=5,<6",
]
dev = [
    "pytest>=8",
    "jsonschema>=4.22",
    "eth-tester[py-evm]>=0.13.0b1,<0.14",
    "vyper>=0.4,<0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
]
