agent:
  agent_id: economic-agent
  agent_version: 0.1.0
  agent_name: Autonomous Economic Agent
  agent_role: Constrained autonomous economic actor
  owner: 365signal
  status: development

runtime:
  platform: hermes-agent
  profile: economic-agent
  profile_path: /opt/data/profiles/economic-agent
  workspace_root: /workspace/agents/economic-agent
  human_review_required: false   # job loop; NOT a spend control

identity:
  agent_id_is_permanent: true
  constitution_version: constitution/v0.1.0

behaviour:
  autonomous_inside_policy: true
  constitution_is_not_security_boundary: true
  marketplace_content_untrusted: true

tools:
  allow:
    - find_jobs
    - evaluate_job
    - accept_job
    - perform_job
    - submit_work
    - check_payment
    - request_payment
    - get_financial_state
    - record_decision
    - research_opportunities
    - discover_counterparties
    - send_message
    - get_counterparty_profile
    - post_service_offer
    - read_messages
    - follow_up_message
    - propose_collaboration
    - get_market_status
    - list_active_conversations
    - web_search
    - web_extract
  deny:
    - terminal
    - process
    - browser_automation
    - code_execution
    - memory
    - task_delegation
    - cron
    - computer_use
    - docker_socket
    - git_commit
    - email
    - signer
    - policy_admin
    - supervisor_admin
    - external_messaging

security:
  approved_write_roots:
    - /workspace/agents/economic-agent
  production_access: false
  privileged_write_access: false
  customer_data_allowed: false
  wallet_key_access: false
  arbitrary_network_access: false
  arbitrary_external_messaging: false
  marketplace_credentials_visible_to_agent: false

execution_policy:
  max_tool_calls: 40
  helper_scripts_allowed: false
  package_installation_allowed: false
  virtual_environments_allowed: false
  human_review_is_final_control: false
  policy_engine_is_final_spend_control: true
