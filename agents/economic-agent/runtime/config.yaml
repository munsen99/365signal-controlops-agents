model:
  default: qwen3.8-27b
  provider: lmstudio
  base_url: http://127.0.0.1:1234/v1
plugins:
  enabled:
    - economic-agent
  entries:
    economic-agent:
      # Replace built-in web_search/web_extract handlers with the bounded
      # economic-plugin implementations. Does not enable the generic web toolset.
      allow_tool_override: true
agent:
  disabled_toolsets:
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - process
    - project
    - session_search
    - skills
    - spotify
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - x_search
    - yuanbao
compression:
  enabled: false
display:
  tool_progress: all
memory:
  memory_enabled: false
  user_profile_enabled: false
_config_version: 33
platform_toolsets:
  cli:
    - economic
  api_server:
    - economic
smart_model_routing:
  enabled: false
session_reset:
  mode: none
# Model-scoped bearer is injected into the gateway/plugin runtime
# environment only. It must never appear in this file, SOUL.md, or
# run-input.yaml.
#
# Open Question 1 (PR8): file/terminal/process stay in disabled_toolsets.
# Do not re-enable terminal. Do not put `web` or `browser` in platform_toolsets.
# Hermes subtracts disabled toolset *names* globally: `web` includes
# web_search/web_extract and `browser` includes web_search, so those toolsets
# must not be disabled or the plugin's bounded research tools are stripped.
# Generic Hermes web handlers are replaced via allow_tool_override.
# Browser stays default-off and is denied by agent.yaml + pre_tool_call.
