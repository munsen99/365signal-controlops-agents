services:
  postgres:
    image: postgres:17
    container_name: controlops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    env_file:
      - .env

    secrets:
      - postgres_password

    volumes:
      - controlops_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    networks:
      - controlops-data

secrets:
  postgres_password:
    file: /home/proteu5/.config/controlops/postgres/postgres_password

volumes:
  controlops_postgres_data:
    name: controlops-postgres-data

networks:
  controlops-data:
    name: controlops-data