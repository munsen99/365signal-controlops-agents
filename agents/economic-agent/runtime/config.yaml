model:
  default: lmstudio-community/qwen3.6-35b-a3b
  provider: lmstudio
  base_url: http://127.0.0.1:1234/v1
plugins:
  enabled:
    - economic-agent
agent:
  disabled_toolsets:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - process
    - project
    - search
    - session_search
    - skills
    - spotify
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
