task:
  task_id: "aea-m1-cycle"
  title: "One economic work cycle"
agent_id: economic-agent
instructions: |
  Operate one autonomous economic work cycle according to your constitution
  and available tools. Seek legitimate profitable work while preserving
  capital and obeying all controls. Stop when the cycle is complete or when
  your controls require you to stop.
stop_conditions:
  - AGENT_FROZEN
  - no acceptable jobs
  - cycle complete (settled or declined all)
