# Phase-C overlay. Use only with a protected operator env file.
# The signer alone receives the key and live-spend confirmation file.
services:
  economic-control:
    environment:
      AEA_LIVE_WALLET: ${AEA_LIVE_WALLET:?explicit Phase-C operator intent required}
      AEA_POLICY_FILE: /secrets/policy.phase-c.yaml
      AEA_DESTINATIONS_FILE: /secrets/destinations.phase-c.yaml
    volumes:
      - ${AEA_SECRETS:?protected secrets directory required}/policy.phase-c.yaml:/secrets/policy.phase-c.yaml:ro
      - ${AEA_SECRETS:?protected secrets directory required}/destinations.phase-c.yaml:/secrets/destinations.phase-c.yaml:ro

  economic-policy:
    build:
      context: ..
      dockerfile: ops/Dockerfile.economic
      args: {AEA_INSTALL_SOLANA: "1"}
    environment:
      AEA_POLICY_FILE: /secrets/policy.phase-c.yaml
      AEA_DESTINATIONS_FILE: /secrets/destinations.phase-c.yaml
      AEA_SOLANA_NETWORK: mainnet-beta
      AEA_SOLANA_PUBLIC_WALLET: ${AEA_SOLANA_PUBLIC_WALLET:?required}
      AEA_SOLANA_TOKEN_MINT: ${AEA_SOLANA_TOKEN_MINT:?required}
      AEA_SOLANA_TOKEN_DECIMALS: "6"
      AEA_SOLANA_SOURCE_TOKEN_ACCOUNT: ${AEA_SOLANA_SOURCE_TOKEN_ACCOUNT:?required}
      AEA_SOLANA_DESTINATION_OWNER: ${AEA_SOLANA_DESTINATION_OWNER:?required}
    volumes:
      - ${AEA_SECRETS:?protected secrets directory required}/policy.phase-c.yaml:/secrets/policy.phase-c.yaml:ro
      - ${AEA_SECRETS:?protected secrets directory required}/destinations.phase-c.yaml:/secrets/destinations.phase-c.yaml:ro

  economic-signer:
    build:
      context: ..
      dockerfile: ops/Dockerfile.economic
      args: {AEA_INSTALL_SOLANA: "1"}
    environment:
      AEA_WALLET_PHASE: C
      AEA_LIVE_WALLET: ${AEA_LIVE_WALLET:?explicit Phase-C operator intent required}
      AEA_LIVE_SPEND_FILE: /secrets/live/CONFIRM_LIVE_USDC_TRANSFER
      AEA_POLICY_HASH: ${AEA_POLICY_HASH:?Phase-C policy hash required}
      AEA_SIGNER_KEY_FILE: /secrets/signer.key
      AEA_SOLANA_NETWORK: mainnet-beta
      AEA_SOLANA_RPC_URL_FILE: /secrets/solana_rpc_url
      AEA_SOLANA_PUBLIC_WALLET: ${AEA_SOLANA_PUBLIC_WALLET:?required}
      AEA_SOLANA_TOKEN_MINT: ${AEA_SOLANA_TOKEN_MINT:?required}
      AEA_SOLANA_TOKEN_DECIMALS: "6"
      AEA_SOLANA_SOURCE_TOKEN_ACCOUNT: ${AEA_SOLANA_SOURCE_TOKEN_ACCOUNT:?required}
      AEA_SOLANA_DESTINATION_ID: ${AEA_SOLANA_DESTINATION_ID:?required}
      AEA_SOLANA_DESTINATION_OWNER: ${AEA_SOLANA_DESTINATION_OWNER:?required}
      AEA_SOLANA_COMMITMENT: finalized
      AEA_SOLANA_CONFIRMATION_TIMEOUT: ${AEA_SOLANA_CONFIRMATION_TIMEOUT:-120}
      AEA_SOLANA_RPC_TIMEOUT: ${AEA_SOLANA_RPC_TIMEOUT:-20}
    volumes:
      - ${AEA_SECRETS:?protected secrets directory required}/signer.key:/secrets/signer.key:ro
      - ${AEA_SECRETS:?protected secrets directory required}/solana_rpc_url:/secrets/solana_rpc_url:ro
      - ${AEA_SECRETS:?protected secrets directory required}/live/CONFIRM_LIVE_USDC_TRANSFER:/secrets/live/CONFIRM_LIVE_USDC_TRANSFER:ro

  economic-wallet:
    build:
      context: ..
      dockerfile: ops/Dockerfile.economic
      args: {AEA_INSTALL_SOLANA: "1"}
    environment:
      AEA_WALLET_PHASE: C
      AEA_SOLANA_NETWORK: mainnet-beta
      AEA_SOLANA_RPC_URL_FILE: /secrets/solana_rpc_url
      AEA_SOLANA_PUBLIC_WALLET: ${AEA_SOLANA_PUBLIC_WALLET:?required}
      AEA_SOLANA_TOKEN_MINT: ${AEA_SOLANA_TOKEN_MINT:?required}
      AEA_SOLANA_TOKEN_DECIMALS: "6"
      AEA_SOLANA_SOURCE_TOKEN_ACCOUNT: ${AEA_SOLANA_SOURCE_TOKEN_ACCOUNT:?required}
      AEA_SOLANA_COMMITMENT: finalized
      AEA_SOLANA_RPC_TIMEOUT: ${AEA_SOLANA_RPC_TIMEOUT:-20}
    volumes:
      - ${AEA_SECRETS:?protected secrets directory required}/solana_rpc_url:/secrets/solana_rpc_url:ro

  economic-supervisor:
    environment:
      AEA_POLICY_FILE: /secrets/policy.phase-c.yaml
    volumes:
      - ${AEA_SECRETS:?protected secrets directory required}/policy.phase-c.yaml:/secrets/policy.phase-c.yaml:ro
