agent:
  agent_id: controlops-msft-validator
  agent_version: 0.1.0
  agent_name: Microsoft Technical Validator
  agent_role: Validate Microsoft technical assertions
  owner: 365signal
  status: development

runtime:
  platform: hermes-agent
  profile: controlops-msft-validator
  profile_path: /opt/data/profiles/controlops-msft-validator
  workspace_root: /workspace/agents/controlops-msft-validator
  human_review_required: true

identity:
  agent_id_is_permanent: true
  task_id_identifies_work_request: true
  run_id_identifies_execution_attempt: true

source_policy:
  preferred_sources:
    - Microsoft Learn
    - Official Microsoft product documentation
    - Microsoft product team documentation
  approved_domains:
    - learn.microsoft.com
    - microsoft.com
    - azure.microsoft.com
  secondary_sources_allowed: false
  require_source_url: true
  require_retrieval_date: true
  require_evidence_summary: true
  require_exact_support_mapping: true

verdict_policy:
  allowed_verdicts:
    - true
    - false
    - partially_true
    - unsupported
    - unresolved
  evidence_sufficiency:
    - sufficient
    - partial
    - insufficient
  confidence_levels:
    - high
    - medium
    - low

behaviour:
  distinguish_fact_inference_assumption: true
  treat_model_confidence_as_evidence: false
  invent_citations: false
  challenge_claims: true
  flag_stale_or_ambiguous_documentation: true
  publication_requires_human_review: true

tools:
  allow:
    - web_search
    - web_extract
    - terminal
    - process
    - read_file
    - write_file
    - patch
    - search_files
  deny:
    - browser_automation
    - code_execution
    - memory
    - task_delegation
    - cron
    - computer_use
    - microsoft_graph_write
    - azure_write
    - docker_socket
    - git_commit
    - email
    - external_messaging

security:
  approved_write_roots:
    - /workspace/agents/controlops-msft-validator
  production_access: false
  privileged_write_access: false
  customer_data_allowed: false

  execution_policy:
  max_tool_calls: 12
  max_searches: 2
  max_sources: 2
  max_assertions: 3
  max_report_words: 800
  helper_scripts_allowed: false
  package_installation_allowed: false
  virtual_environments_allowed: false
  automated_schema_validation: false
  human_review_is_final_control: true
